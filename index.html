<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TECHCYCLE - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

 <body>

    <main class="login-page">

    <section class="left-side">

    <img src="techcycle img.jpg" alt="Logo Techcycle" style="width: 45%; height: auto; object-fit: contain; display: block; margin: 0 auto 20px auto;">



    <div class="chuva-reciclagem">

        <span>♻</span>
        <span>♻</span>

        <span>♻</span>

    </div>

</section>


    <section class="right-side">

        <div class="login-container">

            <h2 class="fredoka">Log in</h2>

            <p class="login-description">
                <b>Use seu email para entrar</b><br>
                <b>na sua conta</b>
            </p>

            <form id="login-form">

                <div class="input-group">

                    <label for="email"><b>E-mail</b></label>

                    <input 
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="input-group">

                    <label for="password"><b>Senha</b></label>

                    <input 
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                    >

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <p class="create-account">

                <b>Ainda não possui uma conta?</b>

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </div>

    </section>

</main>
           <script src="js/script.js"></script>

</body>
</html>
