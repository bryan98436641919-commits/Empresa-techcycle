        <!-- Lado direito -->
        <section class="cadastro-right">

            <div class="cadastro-container">

                <h1 class="fredoka">Cadastre-se</h1>

                <p class="cadastro-description">
                    <b>Use seu e-mail ou algum outro recurso</b><br>
                    <b>para criar a sua conta.</b>
                </p>


                <button type="button" class="cadastro-button secondary">
                    <b>Continue com o Google</b>
                </button>


                <button type="button" class="cadastro-button secondary">
                    <b>Continue com o telefone</b>
                </button>


                <div class="separator">

                    <span></span>

                    <p><b>ou</b></p>

                    <span></span>

                </div>


                <button type="button" class="cadastro-button primary" id="email-button">
    <b>Continue com o e-mail</b>
</button>

<div id="email-form" class="email-form">

    <h2 class="fredoka">Criar conta</h2>

    <div class="cadastro-input">
        <label for="nome"><b>Nome</b></label>
        <input type="text" id="nome" placeholder="Digite seu nome">
    </div>

    <div class="cadastro-input">
        <label for="email"><b>Email</b></label>
        <input type="email" id="email" placeholder="Digite seu e-mail">
    </div>

    <div class="cadastro-input">
        <label for="senha"><b>Senha</b></label>
        <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <div class="cadastro-input">
        <label for="confirmar-senha"><b>Confirmar senha</b></label>
        <input type="password" id="confirmar-senha" placeholder="Digite a senha novamente">
    </div>

    <button type="button" class="cadastro-button primary" id="criar-conta">
        Criar conta
    </button>

</div>

            </div>
